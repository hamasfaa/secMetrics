services:
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: secmetrics-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - secmetrics

  pushgateway-init:
    image: busybox:1.37
    container_name: secmetrics-pushgateway-init
    user: root
    command: sh -c "mkdir -p /data && chown -R 65534:65534 /data"
    volumes:
      - pushgateway_data:/data
    restart: "no"
    networks:
      - secmetrics

  pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: secmetrics-pushgateway
    restart: unless-stopped
    depends_on:
      pushgateway-init:
        condition: service_completed_successfully
    ports:
      - "9091:9091"
    command:
      - "--persistence.file=/data/pushgateway.store"
      - "--persistence.interval=1m"
    volumes:
      - pushgateway_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secmetrics

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: secmetrics-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    depends_on:
      alertmanager-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - secmetrics

  alertmanager-init:
    image: busybox:1.37
    container_name: secmetrics-alertmanager-init
    user: root
    command: sh -c "mkdir -p /alertmanager && chown -R 65534:65534 /alertmanager"
    volumes:
      - alertmanager_data:/alertmanager
    restart: "no"
    networks:
      - secmetrics

  alert-sink:
    image: python:3.13-slim
    container_name: secmetrics-alert-sink
    restart: unless-stopped
    command: ["python", "/app/alert_sink.py"]
    volumes:
      - ./monitoring/alertmanager/alert_sink.py:/app/alert_sink.py:ro,z
    ports:
      - "5001:5001"
    networks:
      - secmetrics

  trivy:
    image: aquasec/trivy:0.72.0
    container_name: secmetrics-trivy
    profiles: ["tools"]
    volumes:
      - ./reports:/reports:z
      - ./app:/src:ro,z
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy_cache:/root/.cache
    networks:
      - secmetrics

  semgrep:
    image: semgrep/semgrep:1.171.0
    container_name: secmetrics-semgrep
    profiles: ["tools"]
    volumes:
      - ./reports:/reports:z
      - ./app:/src:ro,z
    environment:
      SEMGREP_SEND_METRICS: "off"
    networks:
      - secmetrics

  gitleaks:
    image: zricethezav/gitleaks:v8.30.1
    container_name: secmetrics-gitleaks
    profiles: ["tools"]
    volumes:
      - ./reports:/reports:z
      - ./app:/src:ro,z
    networks:
      - secmetrics

  docker-bench:
    image: docker/docker-bench-security:latest
    container_name: secmetrics-docker-bench
    profiles: ["tools"]
    network_mode: host
    pid: host
    userns_mode: host
    cap_add:
      - audit_control
    labels:
      docker_bench_security: ""
    volumes:
      - ./reports:/reports:z
      - /etc:/etc:ro
      - /var/lib:/var/lib:ro
      - /usr/lib/systemd:/usr/lib/systemd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  exporter:
    build:
      context: ./exporter
    image: secmetrics/exporter:latest
    container_name: secmetrics-exporter
    profiles: ["tools"]
    pull_policy: build
    volumes:
      - ./reports:/reports:ro,z
    environment:
      SECMETRICS_GATEWAY: http://pushgateway:9091
    depends_on:
      pushgateway:
        condition: service_healthy
    networks:
      - secmetrics

  grafana:
    image: grafana/grafana:12.2.0
    container_name: secmetrics-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - secmetrics

networks:
  secmetrics:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  pushgateway_data:
  alertmanager_data:
  trivy_cache:
